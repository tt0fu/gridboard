[package]
name = "gridboard"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
# audio
audioadapter = "3.0.0"
cpal = { version = "0.17.3", features = ["jack"] }
rubato = { version = "2.0.0", features = ["fft_resampler"] }
symphonia = { version = "0.5.5", features = ["all"] }

# ui
iced = { version = "0.14.0", features = ["image"] }

# config
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
jsonc = "0.1.0"
directories = "6.0.0"
shellexpand = "3.1.2"

# ipc
anyhow = "1.0.102"
tokio = { version = "1.52.3", features = ["full"] }
iced_core = "0.14.0"
