[package]
name = "gridboard"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
# audio
audioadapter = "5.0.0"
cpal = { version = "0.17.3", features = ["jack"] }
rubato = { version = "5.0.1", features = ["fft_resampler"] }
symphonia = { version = "0.5.5", features = ["all"] }

# ui
eframe = { version = "0.35.0", default-features = false, features = [
    "wgpu",
    "wayland",
    "x11",
    "default_fonts",
] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }

# config
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jsonc = "0.1.0"
directories = "6.0.0"
shellexpand = "3.1.2"

# ipc
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["full"] }